name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: agentic-chatbot-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # 1. CONTINUOUS INTEGRATION
  # ============================================================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: python -m pip install --upgrade pip ruff

      # Syntax and obvious errors only. Style rules are deliberately not
      # enforced yet so the pipeline does not fail on cosmetics.
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 .

      - name: Verify both modules import cleanly
        env:
          # Dummy values: importing backend.py constructs clients but makes
          # no network calls. This catches syntax and import errors early
          # without needing real credentials in CI.
          OPENAI_API_KEY: sk-ci-placeholder
          TAVILY_API_KEY: tvly-ci-placeholder
        run: |
          python -m pip install -r requirements.txt
          python -c "import ast; [ast.parse(open(f).read()) for f in ('app.py','backend.py')]; print('syntax OK')"

      - name: Run unit tests
        run: |
          if [ -d tests ]; then
            python -m pip install pytest
            pytest -q
          else
            echo "No tests/ directory yet - skipping."
            echo "See PROJECT_BIBLE.md: tools_condition routing and the"
            echo "interrupt/resume cycle are both testable without API calls."
          fi

  # ============================================================
  # 2. BUILD AND PUSH IMAGE TO DOCKER HUB
  # ============================================================
  push_to_registry:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest
    # Never push an image from a pull request.
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker registry settings
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          missing=0
          for name in DOCKER_USERNAME IMAGE_NAME; do
            if [ -z "$(eval echo \$$name)" ]; then
              echo "::error::Secret $name is missing."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Docker registry settings are configured."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:main
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 3. DEPLOY TO EC2 SELF-HOSTED RUNNER
  # ------------------------------------------------------------
  # Skipped until you set the repository variable DEPLOY_ENABLED=true
  # (Settings > Secrets and variables > Actions > Variables).
  # Without this guard the job would queue forever waiting for a
  # self-hosted runner that does not exist yet, and every push would
  # show a hung workflow.
  # ============================================================
  continuous_deployment:
    name: Deploy to EC2
    needs: push_to_registry
    runs-on: self-hosted
    if: vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Only keys the application genuinely cannot start without.
      # GOOGLE_API_KEY was removed: Gemini is no longer used anywhere.
      - name: Validate required application secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          missing=0
          for name in OPENAI_API_KEY TAVILY_API_KEY; do
            if [ -z "$(eval echo \$$name)" ]; then
              echo "::error::Required secret $name is missing."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Required secrets present."

      # Optional keys: warn instead of failing. A missing key disables one
      # tool; the app still runs and reports it cleanly to the user.
      - name: Check optional secrets
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          [ -n "$ALPHA_VANTAGE_API_KEY" ] || echo "::warning::ALPHA_VANTAGE_API_KEY not set - get_stock_price disabled."
          [ -n "$OPENWEATHER_API_KEY" ]   || echo "::warning::OPENWEATHER_API_KEY not set - get_current_weather disabled."
          [ -n "$LANGSMITH_API_KEY" ]     || echo "::warning::LANGSMITH_API_KEY not set - tracing disabled."

      - name: Pull latest Docker image
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
        run: docker pull "${IMAGE_PATH}:main"

      - name: Stop and remove existing container
        run: docker rm -f stapp 2>/dev/null || true

      # The named volume is what keeps conversations and vector indexes
      # alive across deploys. Without it, "docker rm -f" above would wipe
      # every thread on every push.
      - name: Run Streamlit container
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        run: |
          docker volume create chatbot-data >/dev/null
          docker run -d \
            --restart unless-stopped \
            --name stapp \
            -p 8501:8501 \
            -v chatbot-data:/app/data \
            -e DATA_DIR=/app/data \
            -e OPENAI_API_KEY \
            -e TAVILY_API_KEY \
            -e ALPHA_VANTAGE_API_KEY \
            -e OPENWEATHER_API_KEY \
            -e LANGSMITH_TRACING \
            -e LANGSMITH_ENDPOINT \
            -e LANGSMITH_API_KEY \
            -e LANGSMITH_PROJECT \
            "${IMAGE_PATH}:main"

      - name: Verify container is running
        run: |
          sleep 10
          if ! docker ps --filter "name=^stapp$" --filter "status=running" \
                         --format "{{.Names}}" | grep -q "^stapp$"; then
            echo "::error::The Streamlit container failed to start."
            docker logs stapp || true
            exit 1
          fi
          echo "Container is running."

      - name: Verify Streamlit health endpoint
        run: |
          for attempt in $(seq 1 12); do
            if docker exec stapp python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)" \
              >/dev/null 2>&1; then
              echo "Streamlit application is healthy."
              exit 0
            fi
            echo "Waiting for Streamlit to become ready... ($attempt/12)"
            sleep 5
          done
          echo "::error::Streamlit did not become healthy."
          docker logs --tail 100 stapp || true
          exit 1

      - name: Show recent application logs
        if: always()
        run: docker logs --tail 50 stapp 2>/dev/null || true

      - name: Remove unused Docker images
        if: always()
        run: docker image prune -f
